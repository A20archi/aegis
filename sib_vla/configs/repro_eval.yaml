# Eval config for the from-base retrained SmolVLA (doc §2b proper-repro recipe).
# Checkpoint = local lerobot-train output (resolved by run_repro_pipeline.sh).

suite: libero_spatial
checkpoint: outputs/smolvla_spatial_repro/checkpoints/020000/pretrained_model
repo_id: HuggingFaceVLA/libero
dataset_root: null
fps: 10

chunk_size: 50
n_action_steps: 10     # doc recommends 10 for chunk-50 models; overridden per sweep via CLI

seeds: [42, 123, 456]
episodes_per_task: 20
eval_n_envs: 20
per_task_build: true
episode_length: 300

device: cuda
n_gpus: 1
output_dir: results/repro
